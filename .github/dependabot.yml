# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "uv" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/apps/swiss-tts-app" # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
      # React core and its test renderer are version-locked: react-test-renderer
      # (and test-renderer) must match react exactly, so update them together.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "react-test-renderer"
          - "test-renderer"
          - "@types/react"
          - "@types/react-dom"
      # React Native and its scoped packages (incl. assets-registry, which the
      # jest preset needs) release in lockstep; group so they never split.
      react-native:
        patterns:
          - "react-native"
          - "@react-native/*"
          - "@react-native-community/*"
      # The Expo SDK and its modules are released as a coordinated set.
      expo:
        patterns:
          - "expo"
          - "expo-*"
          - "babel-preset-expo"
          - "jest-expo"
      # React Native Testing Library + its matchers/helpers.
      testing-library:
        patterns:
          - "@testing-library/*"
  - package-ecosystem: "docker" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"

