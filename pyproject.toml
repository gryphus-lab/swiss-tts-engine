[project]
name = "swiss-tts-monorepo"
# Single source of truth for the project's semantic version. See VERSIONING.md.
# Keep in sync with apps/swiss-tts-app/{package.json,app.json} (scripts/check_version.py).
version = "1.7.80"
description = "Monorepo for Swiss German text-to-speech applications and components."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "coverage>=7.8,<8",
    "ruff>=0.15.21",
]

[tool.ruff]
exclude = [
    ".venv",
    "node_modules",
    "build",
    "uv.lock",
]

[tool.uv.workspace]
members = [
    "apps/swiss-tts-engine",
]

[tool.uv]
override-dependencies = [
    "sentencepiece>=0.2.1",
]
